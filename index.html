<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тактическая подготовка | Контрольный тренажер 10 класс</title>
  <style>
    :root {
      --bg-main: #121517;
      --panel-bg: #1a1e22;
      --card-bg: #22272c;
      --card-hover: #2b3238;
      --accent-blue: #00a6fb;
      --accent-orange: #ff6b35;
      --text-main: #ededed;
      --text-muted: #9aa0a6;
      --border-color: #3b443b;
      --border-highlight: #5a665a;
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      width: 100%;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-badge {
      background: rgba(0, 166, 251, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .hud-counter {
      color: var(--accent-orange);
      font-weight: 700;
      font-size: 1rem;
    }

    /* Прогресс-бар */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--card-bg);
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
      transition: width 0.3s ease;
    }

    /* Карточки с защитой/шторкой */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .hud-corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--accent-blue);
    }
    .hud-top-left { top: -1px; left: -1px; border-top: 2px solid var(--accent-blue); border-left: 2px solid var(--accent-blue); }
    .hud-top-right { top: -1px; right: -1px; border-top: 2px solid var(--accent-blue); border-right: 2px solid var(--accent-blue); }
    .hud-bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid var(--accent-blue); border-left: 2px solid var(--accent-blue); }
    .hud-bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent-blue); border-right: 2px solid var(--accent-blue); }

    .curtain-box {
      position: relative;
      background: var(--card-bg);
      border: 1px dashed var(--border-highlight);
      border-radius: 6px;
      padding: 18px;
      cursor: pointer;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .curtain-box:hover {
      border-color: var(--accent-blue);
      background: var(--card-hover);
    }

    .curtain-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26, 30, 34, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-radius: 6px;
      z-index: 2;
    }

    .curtain-overlay span.icon {
      font-size: 1.2rem;
      color: var(--accent-orange);
    }

    .curtain-box.revealed .curtain-overlay {
      display: none;
    }

    .curtain-content {
      width: 100%;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-item {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.2s ease;
    }

    .option-item:hover {
      border-color: var(--accent-blue);
      background: var(--card-hover);
      transform: translateY(-1px);
    }

    .option-item.selected {
      border-color: var(--accent-orange);
      background: rgba(255, 107, 53, 0.1);
    }

    .option-indicator {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .option-item.selected .option-indicator {
      border-color: var(--accent-orange);
      color: var(--accent-orange);
      background: rgba(255, 107, 53, 0.2);
    }

    .option-text {
      font-size: 1rem;
      color: var(--text-main);
    }

    .control-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
    }

    .btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 12px 26px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      background: #0093de;
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #414a52;
      color: #727a82;
      cursor: not-allowed;
      transform: none;
    }

    .btn-orange {
      background: var(--accent-orange);
    }
    .btn-orange:hover {
      background: #e55c27;
    }

    /* Интерактивные разгрузки (НЛП-паузы) */
    .pause-screen {
      text-align: center;
      padding: 20px 10px;
    }

    .pause-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid var(--accent-orange);
      color: var(--accent-orange);
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .pause-title {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #fff;
    }

    .pause-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Игра 1: Сетка внимания */
    .grid-attention {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 360px;
      margin: 0 auto 20px auto;
    }

    .grid-cell {
      height: 70px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .grid-cell:hover {
      border-color: var(--accent-blue);
    }

    /* Игра 2: Дыхательный круг */
    .breath-circle-container {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .breath-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,166,251,0.4) 0%, rgba(0,166,251,0.05) 70%);
      border: 2px solid var(--accent-blue);
      animation: breathe 16s infinite ease-in-out;
    }

    .breath-phase-text {
      position: absolute;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.6); opacity: 0.5; }
      25% { transform: scale(1.1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 1; }
      75% { transform: scale(0.6); opacity: 0.6; }
    }

    /* Результаты */
    .result-score-block {
      text-align: center;
      margin-bottom: 30px;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 auto 15px auto;
      color: #fff;
      background: rgba(0, 166, 251, 0.1);
    }

    .grade-label {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .review-item {
      background: var(--card-bg);
      border-left: 4px solid var(--border-color);
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .review-item.correct { border-left-color: var(--success); }
    .review-item.wrong { border-left-color: var(--danger); }

    .review-item-q { font-weight: 600; margin-bottom: 6px; }
    .review-ans-row { display: flex; gap: 15px; font-size: 0.85rem; }
    .ans-correct-val { color: var(--success); font-weight: 600; }
    .ans-user-val { color: var(--danger); font-weight: 600; }

    .watermark-notice {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #646e77;
      text-align: center;
    }
  </style>
</head>

window.addEventListener('keydown', (e) => {
  // Блокировка Ctrl+C, Ctrl+A, Ctrl+U, Ctrl+S, Ctrl+P, F12

    e.preventDefault();
    return false;
  }
  if (e.key === 'F12') {
    e.preventDefault();
    return false;
  }
});

      "Сбор мусора и гильз после окончания полевых учений"
    ],
    ans: 0
  },
  {
    q: "Что такое круговой сектор обзора?",
    options: [
      "Возможность наблюдения за полем боя на 360 градусов вокруг своей позиции",
      "Сектор наблюдения шириной строго 45 градусов",
      "Наблюдение только в направлении восхода солнца",
      "Слежение за движением космических аппаратов"
    ],
    ans: 0
  },
  {
    q: "Что такое боевое слаживание подразделения?",
    options: [
      "Обучение военнослужащих согласованным действиям в составе отделения, взвода и роты при выполнении боевых задач",
      "Совместное хоровое пение строевых песен",
      "Распределение спальных мест в казарменном помещении",
      "Примерка и подгонка парадного обмундирования"
    ],
    ans: 0
  },
  {
    q: "Что является решающим фактором победы в современном общевойсковом бою?",
    options: [
      "Сочетание огневой мощи, инициативы, слаженности действий и тактической гибкости командира",
      "Исключительно численное превосходство без применения связи и тактики",
      "Отказ от использования современных беспилотных систем",
      "Длительное пассивное ожидание действий противника"
    ],
    ans: 0
  }
];

/* ==========================================================================
   3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
   ========================================================================== */
const STATE = {
  activeQuestions: [], // Ровно 20 отобранных вопросов
  currentIndex: 0,     // 0..19
  userAnswers: {},     // { questionIndex: selectedOptionIndex }
  isQuestionRevealed: false,
  isOptionRevealed: false,
  showingPause: null,  // 'pause_5', 'pause_10', 'pause_15' или null
  finished: false
};

// Функция перемешивания Фишера-Йетса
function shuffleArray(arr) {
  const array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Инициализация теста: берем 20 случайных вопросов и рандомизируем варианты
function initTest() {
  const shuffledPool = shuffleArray(FULL_QUESTION_BANK);
  const selected20 = shuffledPool.slice(0, 20);

  STATE.activeQuestions = selected20.map(item => {
    // Перемешиваем варианты ответов, сохраняя верный
    const paired = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.ans }));
    const shuffledOpts = shuffleArray(paired);
    const newCorrectIdx = shuffledOpts.findIndex(p => p.isCorrect);
    return {
      q: item.q,
      options: shuffledOpts.map(p => p.text),
      ans: newCorrectIdx
    };
  });

  STATE.currentIndex = 0;
  STATE.userAnswers = {};
  STATE.isQuestionRevealed = false;
  STATE.isOptionRevealed = false;
  STATE.showingPause = null;
  STATE.finished = false;
  render();
}

/* ==========================================================================
   4. РЕНДЕР ИНТЕРФЕЙСА
   ========================================================================== */
const appRoot = document.getElementById('appRoot');
const hudCounter = document.getElementById('hudCounter');
const progressBar = document.getElementById('progressBar');

function render() {
  if (STATE.finished) {
    renderResults();
    return;
  }

  // Проверка на паузы
  if (STATE.showingPause) {
    renderPauseScreen(STATE.showingPause);
    return;
  }

  // Обновление прогресса
  const progressPercent = (STATE.currentIndex / 20) * 100;
  progressBar.style.width = `${progressPercent}%`;
  hudCounter.textContent = `ВОПРОС: ${STATE.currentIndex + 1} / 20`;

  const curQ = STATE.activeQuestions[STATE.currentIndex];
  const selectedOpt = STATE.userAnswers[STATE.currentIndex];

  appRoot.innerHTML = `
    <div class="panel">
      <div class="hud-corner hud-top-left"></div>
      <div class="hud-corner hud-top-right"></div>
      <div class="hud-corner hud-bottom-left"></div>
      <div class="hud-corner hud-bottom-right"></div>

      <!-- Плашка скрытия вопроса -->
      <div class="curtain-box ${STATE.isQuestionRevealed ? 'revealed' : ''}" id="questionCurtain">
        <div class="curtain-overlay">
          <span class="icon">🔒</span>
          <strong>ВОПРОС ЗАСЕКРЕЧЕН</strong>
          <span>Нажмите на плашку, чтобы отобразить текст вопроса</span>
        </div>
        <div class="curtain-content">
          ${curQ.q}
        </div>
      </div>

      <!-- Плашка скрытия вариантов ответа -->
      <div style="margin-top: 15px;">
        <div class="curtain-box ${STATE.isOptionRevealed ? 'revealed' : ''}" id="optionsCurtain" style="min-height: 50px; padding: 12px;">
          <div class="curtain-overlay">
            <span class="icon">👁️</span>
            <strong>ВАРИАНТЫ СКРЫТЫ</strong>
            <span>Нажмите для разблокировки вариантов ответов</span>
          </div>
          <div class="curtain-content" style="font-size: 0.9rem; color: var(--accent-blue); text-align: center;">
            ✓ Варианты открыты. Выберите один верный ответ ниже:
          </div>
        </div>
      </div>

      <!-- Варианты ответов -->
      <div class="options-grid" style="${STATE.isOptionRevealed ? '' : 'filter: blur(8px); pointer-events: none; opacity: 0.4;'}">
        ${curQ.options.map((optText, optIdx) => `
          <div class="option-item ${selectedOpt === optIdx ? 'selected' : ''}" onclick="selectAnswer(${optIdx})">
            <div class="option-indicator">${String.fromCharCode(65 + optIdx)}</div>
            <div class="option-text">${optText}</div>
          </div>
        `).join('')}
      </div>

      <!-- Кнопки управления -->
      <div class="control-actions">
        <div>
          <button class="btn" style="background: #2b3238;" onclick="prevQuestion()" ${STATE.currentIndex === 0 ? 'disabled' : ''}>
            ← Назад
          </button>
        </div>
        <div>
          <button class="btn btn-orange" onclick="nextQuestion()" ${selectedOpt === undefined ? 'disabled' : ''}>
            ${STATE.currentIndex === 19 ? 'Завершить тест 🏁' : 'Следующий →'}
          </button>
        </div>
      </div>
    </div>
  `;

  // Обработчики кликов по плашкам
  document.getElementById('questionCurtain').addEventListener('click', () => {
    STATE.isQuestionRevealed = !STATE.isQuestionRevealed;
    render();
  });

  document.getElementById('optionsCurtain').addEventListener('click', () => {
    STATE.isOptionRevealed = !STATE.isOptionRevealed;
    render();
  });
}

function selectAnswer(optIdx) {
  STATE.userAnswers[STATE.currentIndex] = optIdx;
  render();
}

function prevQuestion() {
  if (STATE.currentIndex > 0) {
    STATE.currentIndex--;
    STATE.isQuestionRevealed = false;
    STATE.isOptionRevealed = false;
    render();
  }
}

function nextQuestion() {
  const currentNum = STATE.currentIndex + 1; // 1..20

  // Проверка триггеров на интерактивные паузы
  if (currentNum === 5 && STATE.showingPause !== 'done_5') {
    STATE.showingPause = 'pause_5';
    render();
    return;
  }
  if (currentNum === 10 && STATE.showingPause !== 'done_10') {
    STATE.showingPause = 'pause_10';
    render();
    return;
  }
  if (currentNum === 15 && STATE.showingPause !== 'done_15') {
    STATE.showingPause = 'pause_15';
    render();
    return;
  }

  if (STATE.currentIndex < 19) {
    STATE.currentIndex++;
    STATE.isQuestionRevealed = false;
    STATE.isOptionRevealed = false;
    render();
  } else {
    STATE.finished = true;
    render();
  }
}

/* ==========================================================================
   5. ЭКРАНЫ ПСИХОЛОГИЧЕСКИХ ПАУЗ (ПОСЛЕ 5, 10 И 15 ВОПРОСОВ)
   ========================================================================== */
function renderPauseScreen(type) {
  hudCounter.textContent = 'ТАКТИЧЕСКАЯ РАЗГРУЗКА';
  progressBar.style.width = `${(STATE.currentIndex + 1) / 20 * 100}%`;

  if (type === 'pause_5') {
    appRoot.innerHTML = `
      <div class="panel pause-screen">
        <span class="pause-badge">Психологическая калибровка • После 5 вопроса</span>
        <h2 class="pause-title">Тест периферийного зрения: Сектор внимания</h2>
        <p class="pause-desc">
          НЛП-якорь «Фокус»: снимите напряжение с глаз. Найдите среди тактических квадрантов единственный с символом <strong>[🎯]</strong> и кликните по нему.
        </p>
        <div class="grid-attention" id="gridAttention">
          ${generateAttentionGrid()}
        </div>
        <button class="btn btn-orange" id="btnResume5" style="display: none;" onclick="resumeFromPause('done_5')">
          Внимание откалибровано • Продолжить тест
        </button>
      </div>
    `;
  } else if (type === 'pause_10') {
    appRoot.innerHTML = `
      <div class="panel pause-screen">
        <span class="pause-badge">Кинестетическая стабилизация • Экватор теста (10/20)</span>
        <h2 class="pause-title">«Квадрат дыхания снайпера»</h2>
        <p class="pause-desc">
          Сфокусируйтесь на пульсирующей сфере. Сделайте глубокий вдох (4 сек) — задержка (4 сек) — плавный выдох (4 сек) — стабилизация. Восстановите хладнокровие.
        </p>
        <div class="breath-circle-container">
          <div class="breath-circle"></div>
          <div class="breath-phase-text" id="breathPhase">ВДОХ</div>
        </div>
        <p style="color: var(--accent-blue); font-size: 0.9rem; margin-bottom: 20px;">
          Кислород активирует префронтальную кору мозга, ускоряя логический анализ.
        </p>
        <button class="btn btn-orange" onclick="resumeFromPause('done_10')">
          Дыхание стабилизировано • Вперед к штурму
        </button>
      </div>
    `;
    startBreathCycle();
  } else if (type === 'pause_15') {
    appRoot.innerHTML = `
      <div class="panel pause-screen">
        <span class="pause-badge">Тактическая интуиция • 15 вопросов позади</span>
        <h2 class="pause-title">Блиц-распознавание: Техника на поле боя</h2>
        <p class="pause-desc">
          Вам навстречу на полной скорости движется бронемашина с тяжелым 30-мм автоматическим орудием и десантом из 8 бойцов внутри. Что это за машина?
        </p>
        <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
          <button class="btn" onclick="checkVehicleGuess(true)">БМП (Боевая машина пехоты)</button>
          <button class="btn" style="background:#444;" onclick="checkVehicleGuess(false)">БТР (Бронетранспортер)</button>
        </div>
        <div id="vehicleFeedback" style="min-height: 24px; font-weight: 600; font-size: 0.95rem; margin-bottom: 15px;"></div>
        <button class="btn btn-orange" id="btnResume15" style="display: none;" onclick="resumeFromPause('done_15')">
          Выход на финальный рубеж (Вопросы 16–20)
        </button>
      </div>
    `;
  }
}

function generateAttentionGrid() {
  const targetIdx = Math.floor(Math.random() * 8);
  let html = '';
  for (let i = 0; i < 8; i++) {
    if (i === targetIdx) {
      html += `<div class="grid-cell" onclick="handleTargetClick(this)">🎯</div>`;
    } else {
      html += `<div class="grid-cell" onclick="this.style.opacity='0.2'">⬛</div>`;
    }
  }
  return html;
}

function handleTargetClick(el) {
  el.style.background = 'rgba(0, 166, 251, 0.4)';
  el.style.borderColor = 'var(--accent-blue)';
  el.innerHTML = '✅';
  document.getElementById('btnResume5').style.display = 'inline-block';
}

function startBreathCycle() {
  const textEl = document.getElementById('breathPhase');
  if (!textEl) return;
  const phases = ['ВДОХ', 'ПАУЗА', 'ВЫДОХ', 'ПОКОЙ'];
  let pIdx = 0;
  const interval = setInterval(() => {
    if (!document.getElementById('breathPhase')) {
      clearInterval(interval);
      return;
    }
    pIdx = (pIdx + 1) % phases.length;
    textEl.textContent = phases[pIdx];
  }, 4000);
}

function checkVehicleGuess(isCorrect) {
  const fb = document.getElementById('vehicleFeedback');
  const btn = document.getElementById('btnResume15');
  if (isCorrect) {
    fb.style.color = 'var(--success)';
    fb.textContent = 'Точно в цель! БМП ведет бой вместе с пехотой и оснащена тяжелым орудием.';
  } else {
    fb.style.color = 'var(--accent-orange)';
    fb.textContent = 'БТР выполняет роль бронированного транспорта с пулеметом, а боевая машина пехоты — это БМП!';
  }
  btn.style.display = 'inline-block';
}

function resumeFromPause(pauseMarker) {
  STATE.showingPause = pauseMarker;
  STATE.currentIndex++;
  STATE.isQuestionRevealed = false;
  STATE.isOptionRevealed = false;
  render();
}

/* ==========================================================================
   6. ЭКРАН РЕЗУЛЬТАТОВ И АВТОМАТИЧЕСКОЕ ОЦЕНИВАНИЕ
   ========================================================================== */
function renderResults() {
  progressBar.style.width = '100%';
  hudCounter.textContent = 'ТЕСТИРОВАНИЕ ЗАВЕРШЕНО';

  let correctCount = 0;
  STATE.activeQuestions.forEach((q, idx) => {
    if (STATE.userAnswers[idx] === q.ans) {
      correctCount++;
    }
  });

  let mark = '2';
  let markColor = 'var(--danger)';
  let markTitle = 'Неудовлетворительно';

  if (correctCount >= 18) {
    mark = '5';
    markColor = 'var(--success)';
    markTitle = 'Отлично (Тактический уровень командира)';
  } else if (correctCount >= 15) {
    mark = '4';
    markColor = 'var(--accent-blue)';
    markTitle = 'Хорошо (Твердые теоретические навыки)';
  } else if (correctCount >= 11) {
    mark = '3';
    markColor = 'var(--accent-orange)';
    markTitle = 'Удовлетворительно (Базовый минимум)';
  }

  appRoot.innerHTML = `
    <div class="panel">
      <div class="hud-corner hud-top-left"></div>
      <div class="hud-corner hud-top-right"></div>
      <div class="hud-corner hud-bottom-left"></div>
      <div class="hud-corner hud-bottom-right"></div>

      <div class="result-score-block">
        <div class="score-circle" style="border-color: ${markColor}; color: ${markColor};">
          ${mark}
        </div>
        <div class="grade-label" style="color: ${markColor};">${markTitle}</div>
        <p style="color: var(--text-muted); font-size: 1.05rem;">
          Верных ответов: <strong>${correctCount} из 20</strong> (${Math.round(correctCount / 20 * 100)}%)
        </p>
      </div>

      <h3 style="margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 1rem; color: var(--accent-blue);">
        Тактический аудит ответов:
      </h3>

      <div style="max-height: 380px; overflow-y: auto; padding-right: 8px;">
        ${STATE.activeQuestions.map((q, idx) => {
          const userAns = STATE.userAnswers[idx];
          const isOk = userAns === q.ans;
          return `
            <div class="review-item ${isOk ? 'correct' : 'wrong'}">
              <div class="review-item-q">${idx + 1}.${q.q}</div>
              <div class="review-ans-row">
                <span>Ваш ответ: <span class="${isOk ? 'ans-correct-val' : 'ans-user-val'}">${userAns !== undefined ? q.options[userAns] : 'Нет ответа'}</span></span>
              </div>
              ${!isOk ? `<div class="review-ans-row" style="margin-top: 4px;"><span>Правильный ответ: <span class="ans-correct-val">${q.options[q.ans]}</span></span></div>` : ''}
            </div>
          `;
        }).join('')}
      </div>

      <div style="text-align: center; margin-top: 25px;">
        <button class="btn btn-orange" onclick="initTest()">
          Пройти новый вариант (Новые 20 вопросов)
        </button>
      </div>
    </div>
  `;
}

// Запуск при загрузке страницы
initTest();
</script>
</body>
</html>
